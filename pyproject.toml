[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_robustness"]

[project]
name = "arc-robustness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Core numerics
    "numpy>=1.26",
    "pandas>=2.2",
    # ML / manifold visualisation
    "scikit-learn>=1.4",
    "scipy>=1.13",
    "umap-learn>=0.5",
    "pot>=0.9",
    # Deep learning
    "torch>=2.3",
    "torchvision>=0.18",
    # Plotting
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Notebooks
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
    # Utilities
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
]

# ---------------------------------------------------------------------------
# Platform-conditional torch sources
# ---------------------------------------------------------------------------
# macOS (development): default PyPI wheels, which include MPS support.
#
# linux-aarch64 (Isambard-AI, GH200 Grace-Hopper): the Grace CPU is ARM
# Neoverse-V2, so x86_64 wheels do not apply. PyTorch publishes CUDA-enabled
# aarch64 wheels on its own index only — the manylinux aarch64 wheels on PyPI
# have historically been CPU-only, which would silently give a working but
# GPU-less install. Pinning the index by platform avoids that failure mode,
# which is easy to miss because nothing errors: jobs just run on CPU.

[tool.uv.sources]
torch = [
    { index = "torch-cuda", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "torch-cuda", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "torch-cuda"
# CUDA 12.8 matches the GH200 driver stack. Confirm against the CUDA module
# actually available on the cluster before the first large submission; if it is
# 12.6, change this to cu126.
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: excluded from the default run; Ollivier over many layers",
    "hpc: requires a Slurm environment",
]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = [
    "E741",  # ambiguous name `l`: layer indices are `l`/`ell` throughout the maths
    "B905",  # zip(strict=): the layer/module zips are length-checked by construction
]

[tool.ruff.lint.per-file-ignores]
# Notebooks and the legacy plotting scripts predate the lint config.
"scripts/visualise_*.py" = ["E501"]
"presentation/*.py" = ["E501"]
